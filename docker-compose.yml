services:
  backseat:
    build: .
    container_name: backseat
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data # SQLite memory: survives restarts and rebuilds
      - ./prompts:/app/prompts:ro # default persona, editable without a rebuild
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
