[project]
name = "backseat"
version = "2.2.0"
description = "Group-chat bots for Telegram and Discord with long-term memory"
license = "MIT"
requires-python = ">=3.12"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# Cyrillic text in strings and comments is intentional, not a lookalike-character typo.
ignore = ["RUF001", "RUF002", "RUF003"]
